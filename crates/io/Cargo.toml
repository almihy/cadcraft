[package]
name = "cadcraft-io"
description = "CADCraft file formats: DXF read/write mapping, SVG, PNG and PDF export"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
cadcraft-geom = { workspace = true }
cadcraft-color = { workspace = true }
cadcraft-doc = { workspace = true }
craft-dxf = { workspace = true }
craft-svg = { workspace = true }
craft-image-codecs = { workspace = true }
cadcraft-render = { workspace = true }
cadcraft-fonts = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
craft-pdf = { workspace = true, features = ["write"] }

# DWG files: multithreaded decoding where there are threads.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cadcraft-dwg = { workspace = true, features = ["parallel"] }
[target.'cfg(target_arch = "wasm32")'.dependencies]
cadcraft-dwg = { workspace = true }

[dev-dependencies]
miniz_oxide = "0.9"
tiff = "0.11"
image = { workspace = true }
tiny-skia = { workspace = true }
# Reads plotted PDFs back.
craft-pdf = { workspace = true, features = ["read"] }

# Inspects written DWGs in tests.
acadrust = { workspace = true }
